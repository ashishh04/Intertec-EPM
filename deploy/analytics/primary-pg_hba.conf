# EPM primary database: who may connect (BR-401, NFR04).
#
# The postgres image's own defaults, plus two lines for the analytics replica:
# the replication account may stream from the networks the container is on, and
# the analytics role may not connect here at all — reporting reads the replica,
# never the database people are working in. Mounted read-only and named with
# `-c hba_file=` by docker-compose.prod.yml and docker-compose.deploy.yml.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     epm_replicator  samenet                 scram-sha-256
host    all             epm_analytics   all                     reject
host    all             all             all                     scram-sha-256
