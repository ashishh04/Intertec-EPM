<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#155EEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/epm-icon.svg" />
    <link rel="apple-touch-icon" href="/epm-icon.svg" />
    <title>EPM — Intertec Systems</title>
    <meta
      name="description"
      content="EPM is Intertec Systems' unified project and delivery management platform."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="EPM — Intertec Systems" />
    <meta
      property="og:description"
      content="EPM is Intertec Systems' unified project and delivery management platform."
    />
    <meta property="og:type" content="website" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('epm.theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage unavailable — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
