# EPM, whole stack, one host.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Four services on one internal network, and only Caddy is published. Postgres
# and OpenProject are reachable by service name from inside and by nothing at
# all from outside, which is why the security group only needs 80 and 443.
#
# OpenProject keeps its bind mounts rather than named volumes: they hold the
# instance database and every attachment, and a path you can point at an EBS
# volume is a path you can snapshot.

name: epm

services:
  # ------------------------------------------------------------ OpenProject
  # The system EPM wraps. Not published: EPM is the only thing that talks to
  # it, over the internal network.
  openproject:
    # Built from the same Dockerfile the published image comes from, so this
    # file and docker-compose.deploy.yml load the EPM initializers the same way.
    build:
      context: ./backend/openproject
    image: ${EPM_IMAGE_NAMESPACE:-epm-local}/epm-openproject:${EPM_IMAGE_TAG:-dev}
    container_name: openproject
    restart: unless-stopped
    environment:
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?set a real secret}
      OPENPROJECT_HOST__NAME: ${EPM_DOMAIN:?set the domain}
      # The public hostname above is what OpenProject puts in generated URLs, so
      # it has to be the real domain. But it also becomes Rails' `config.hosts`
      # allowlist, and the backend reaches this container as `http://openproject`
      # on the internal network — a Host header that does not match, which the
      # host authorization middleware answers with a bare 400 "Invalid host_name
      # configuration" on *every* API call.
      #
      # Worth knowing how that fails: /ready calls openProjectReady(), which
      # treats anything under 500 as healthy, so a stack in this state reports
      # itself ready while nothing that touches OpenProject works at all.
      #
      # localhost is here for reaching the admin UI through an SSH tunnel, since
      # this container is deliberately not published.
      #
      # JSON, not a comma-separated list. This is an array setting, and a bare
      # `a,b,c` is read as one element containing commas — which matches no host
      # and fails exactly as if the variable had never been set.
      OPENPROJECT_ADDITIONAL__HOST__NAMES: '["openproject", "localhost", "localhost:8080"]'
      OPENPROJECT_HTTPS: "true"
      OPENPROJECT_DEFAULT__LANGUAGE: en
      # Behind Caddy, so the addresses it sees are the proxy's.
      OPENPROJECT_RAILS__RELATIVE__URL__ROOT: ""
    volumes:
      - ${OPENPROJECT_DATA_DIR:-/srv/openproject}/pgdata:/var/openproject/pgdata
      - ${OPENPROJECT_DATA_DIR:-/srv/openproject}/assets:/var/openproject/assets
    networks: [epm]

  # ------------------------------------------------------------ EPM database
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: epm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password}
      POSTGRES_DB: ${POSTGRES_DB:-epm}
    # Who may connect: the image's defaults, plus the analytics replica's
    # replication account, and a refusal for the analytics role — reporting
    # reads the replica, never this database (BR-401).
    command: ['postgres', '-c', 'hba_file=/etc/epm/pg_hba.conf']
    volumes:
      - epm-pgdata:/var/lib/postgresql/data
      - ./deploy/analytics/primary-pg_hba.conf:/etc/epm/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-epm} -d ${POSTGRES_DB:-epm}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [epm]

  # ---------------------------------------------- analytics replica (BR-401)
  # Only with `--profile analytics`. A streaming, read-only copy of the EPM
  # database that reporting and BI tools read, so they never compete with people
  # for the primary; only the analytics role may connect, and only from
  # EPM_ANALYTICS_ALLOWED_CIDR (default: the Docker networks it is on). The
  # primary refuses that role outright. Before the first start, from the backend:
  #   npm run analytics -- replication epm_analytics_replica
  #   npm run analytics -- role
  # (DEPLOY.md, "Analytics replica").
  postgres-replica:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: epm-postgres-replica
    profiles: [analytics]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '/epm/replica-entrypoint.sh']
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      REPLICATION_USER: epm_replicator
      REPLICATION_PASSWORD: ${EPM_REPLICATION_PASSWORD:?set EPM_REPLICATION_PASSWORD}
      REPLICATION_SLOT: ${EPM_REPLICATION_SLOT:-epm_analytics_replica}
      ANALYTICS_ALLOWED_CIDR: ${EPM_ANALYTICS_ALLOWED_CIDR:-samenet}
    # Published on loopback by default: reach it over an SSH tunnel, or set
    # EPM_ANALYTICS_BIND to the interface the analytics estate connects to.
    ports:
      - '${EPM_ANALYTICS_BIND:-127.0.0.1}:${EPM_ANALYTICS_PORT:-5434}:5432'
    volumes:
      - epm-pgdata-replica:/var/lib/postgresql/data
      - ./deploy/analytics/replica-entrypoint.sh:/epm/replica-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epm_analytics -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [epm]

  # ------------------------------------------------------------ EPM backend
  backend:
    build:
      context: ./backend
    image: ${EPM_IMAGE_NAMESPACE:-epm-local}/epm-backend:${EPM_IMAGE_TAG:-dev}
    container_name: epm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      # Service names, not localhost: each container has its own loopback.
      DATABASE_URL: postgresql://${POSTGRES_USER:-epm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-epm}?schema=public
      OPENPROJECT_BASE_URL: http://openproject
      OPENPROJECT_API_KEY: ${OPENPROJECT_API_KEY:?set the instance API key}
      OPENPROJECT_OAUTH_CLIENT_ID: ${OPENPROJECT_OAUTH_CLIENT_ID}
      OPENPROJECT_OAUTH_CLIENT_SECRET: ${OPENPROJECT_OAUTH_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set a 32+ character secret}
      # Same origin as the app, because Caddy proxies /api on the one domain.
      CORS_ORIGIN: https://${EPM_DOMAIN}
      APP_BASE_URL: https://${EPM_DOMAIN}
      # Mail. Leave the SMTP block empty to fall back to Resend, or both empty
      # to log instead of sending.
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # Implicit TLS. Unset it follows the port, which is right for 465 and 587
      # both; set it only for a provider that disagrees.
      SMTP_SECURE: ${SMTP_SECURE}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EPM_EMAIL_WORKER_ENABLED: ${EPM_EMAIL_WORKER_ENABLED:-true}
      OPENPROJECT_WEBHOOK_SECRET: ${OPENPROJECT_WEBHOOK_SECRET}
      # The bootstrap administrator list. A fresh database has no grant rows and
      # no UI writes the first one, so without this nobody holds an EPM-owned
      # permission and the deployment cannot be administered at all. Carrying a
      # database over hides that; starting clean does not.
      EPM_ADMIN_USER_IDS: ${EPM_ADMIN_USER_IDS}
      # Every scheduler is off unless told otherwise, which is the right default
      # for a test run and the wrong one for a deployment — so a production
      # stack has to name the ones it wants. Snapshots are worth defaulting on
      # here: trend history can only be built forwards, never backfilled.
      EPM_ANALYTICS_SNAPSHOT_ENABLED: ${EPM_ANALYTICS_SNAPSHOT_ENABLED:-true}
      EPM_ANALYTICS_SNAPSHOT_INTERVAL_MINUTES: ${EPM_ANALYTICS_SNAPSHOT_INTERVAL_MINUTES:-1440}
      # The health sweep is the exception to "off unless told": it is what keeps
      # each project's stored health true when work changes where EPM cannot
      # see it. It sends nothing itself.
      EPM_HEALTH_SWEEP_ENABLED: ${EPM_HEALTH_SWEEP_ENABLED:-true}
      EPM_HEALTH_SWEEP_INTERVAL_MINUTES: ${EPM_HEALTH_SWEEP_INTERVAL_MINUTES:-60}
      # Approval SLAs and delegations: on for the same reason.
      EPM_APPROVAL_SWEEP_ENABLED: ${EPM_APPROVAL_SWEEP_ENABLED:-true}
      EPM_APPROVAL_SWEEP_INTERVAL_MINUTES: ${EPM_APPROVAL_SWEEP_INTERVAL_MINUTES:-5}
      # Rules act as the automation account (DEPLOY.md); escalation on schedule.
      OPENPROJECT_AUTOMATION_API_KEY: ${OPENPROJECT_AUTOMATION_API_KEY:-}
      EPM_RULES_ENABLED: ${EPM_RULES_ENABLED:-true}
      EPM_RULES_POLL_SECONDS: ${EPM_RULES_POLL_SECONDS:-5}
      EPM_ESCALATION_SWEEP_ENABLED: ${EPM_ESCALATION_SWEEP_ENABLED:-true}
      EPM_ESCALATION_SWEEP_INTERVAL_MINUTES: ${EPM_ESCALATION_SWEEP_INTERVAL_MINUTES:-15}
      EPM_RULES_OUTBOUND_ALLOWLIST: ${EPM_RULES_OUTBOUND_ALLOWLIST:-}
      EPM_RULES_WEBHOOK_SECRET: ${EPM_RULES_WEBHOOK_SECRET:-}
      # The analytics model every dashboard reads (BRQ-05): refreshed soon after
      # a change and every few minutes, in full each night at this hour, which
      # is expected to finish within the window.
      EPM_ANALYTICS_MODEL_ENABLED: ${EPM_ANALYTICS_MODEL_ENABLED:-true}
      EPM_ANALYTICS_FULL_REFRESH_HOUR_UTC: ${EPM_ANALYTICS_FULL_REFRESH_HOUR_UTC:-1}
      EPM_ANALYTICS_REFRESH_WINDOW_MINUTES: ${EPM_ANALYTICS_REFRESH_WINDOW_MINUTES:-30}
      EPM_DASHBOARD_TARGET_MS: ${EPM_DASHBOARD_TARGET_MS:-2000}
      # The analytics role on the replica, for the access check in
      # Administration (BR-401): postgresql://epm_analytics:<password>@postgres-replica:5432/epm
      EPM_ANALYTICS_DATABASE_URL: ${EPM_ANALYTICS_DATABASE_URL:-}
      # Scheduled reports (BRQ-08), and who hears when an email fails for good.
      EPM_REPORT_SCHEDULER_ENABLED: ${EPM_REPORT_SCHEDULER_ENABLED:-true}
      EPM_REPORT_SCHEDULER_SECONDS: ${EPM_REPORT_SCHEDULER_SECONDS:-60}
      EPM_REPORT_RUN_RETENTION_DAYS: ${EPM_REPORT_RUN_RETENTION_DAYS:-2555}
      EPM_REPORT_ARTIFACT_RETENTION_DAYS: ${EPM_REPORT_ARTIFACT_RETENTION_DAYS:-90}
      EPM_OPS_ALERT_USER_IDS: ${EPM_OPS_ALERT_USER_IDS:-}
      EPM_OPS_ALERT_WEBHOOK_URL: ${EPM_OPS_ALERT_WEBHOOK_URL:-}
      EPM_DUE_REMINDER_ENABLED: ${EPM_DUE_REMINDER_ENABLED}
      EPM_DUE_REMINDER_HOUR_UTC: ${EPM_DUE_REMINDER_HOUR_UTC}
      EPM_DUE_REMINDER_DAYS: ${EPM_DUE_REMINDER_DAYS}
      EPM_EMAIL_DIGEST_HOUR_UTC: ${EPM_EMAIL_DIGEST_HOUR_UTC:-6}
      # The assistant. Left unset it reports itself unavailable rather than
      # refusing to start, so a stack without Bedrock credentials is a feature
      # short rather than broken.
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      EPM_ASSISTANT_REGIONS: ${EPM_ASSISTANT_REGIONS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      # Readiness, not liveness: this one fails while the database or
      # OpenProject is unreachable, which is what "do not send traffic" means.
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:8000/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [epm]

  # ------------------------------------------------------------ Caddy + SPA
  # The only published service. Terminates TLS, serves the built frontend, and
  # proxies /api to the backend on the same origin.
  web:
    build:
      context: ./frontend
      args:
        VITE_APP_ENV: production
    image: ${EPM_IMAGE_NAMESPACE:-epm-local}/epm-web:${EPM_IMAGE_TAG:-dev}
    container_name: epm-web
    restart: unless-stopped
    depends_on: [backend]
    environment:
      EPM_DOMAIN: ${EPM_DOMAIN:?set the domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Certificates survive a recreate; without this Caddy re-issues on every
      # deploy and will meet Let's Encrypt's rate limit.
      - caddy-data:/data
      - caddy-config:/config
    networks: [epm]

volumes:
  epm-pgdata:
  epm-pgdata-replica:
  caddy-data:
  caddy-config:

networks:
  epm:
