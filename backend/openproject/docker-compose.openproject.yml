# OpenProject, reproduced from the container that was originally created by
# hand with `docker run`, plus the one thing that container could not carry:
# the EPM password-grant initializer.
#
# Why this file exists
# -------------------
# EPM signs users in on its own form and exchanges their credentials for an
# OpenProject token. That needs `zzz_epm_password_grant.rb` present inside the
# container. Copying it in with `docker cp` works until the container is
# recreated, at which point sign-in breaks with no obvious cause. Mounting it
# from the repository makes the dependency explicit and survivable.
#
# Usage
# -----
#   docker compose -f backend/openproject/docker-compose.openproject.yml up -d
#
# OpenProject's database is its own Postgres service (openproject-db, a named
# volume), not the one bundled inside the image: setting DATABASE_URL to
# another host is what tells the image not to start its own. Its password is
# OPENPROJECT_DB_PASSWORD, kept in backend/openproject/.env (gitignored).
# Attachments stay a bind mount on the host; override its location with
# OPENPROJECT_DATA_DIR if this is deployed elsewhere.
#
# Upgrade implications
# --------------------
# The initializer mutates Doorkeeper's configuration and calls
# `User.try_to_login`. Both are internal OpenProject APIs. After changing the
# `image` tag below, verify sign-in still works before considering the upgrade
# done — see backend/openproject/README.md.

services:
  # OpenProject's own database (Module 20), so it can be backed up, restored,
  # replicated and later moved to a managed Postgres without touching the app.
  openproject-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: openproject-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OPENPROJECT_DB_PASSWORD:?set it in backend/openproject/.env}
      POSTGRES_DB: openproject
    volumes:
      - openproject-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openproject -d openproject']
      interval: 10s
      timeout: 5s
      retries: 10

  openproject:
    image: openproject/openproject:17.9.2@sha256:3603f071443e16f773ca0e6bbe7f12f66eeeb95cca4540c4f93ec504305a0596
    container_name: openproject
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      openproject-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openproject:${OPENPROJECT_DB_PASSWORD:?set it in backend/openproject/.env}@openproject-db:5432/openproject
      # Matches the original container. SECRET_KEY_BASE must be a real secret
      # in any deployment that is not a local throwaway.
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:-secret}
      # From 17 OpenProject refuses to boot on the image's default
      # SECRET_KEY_BASE, which is the key this local instance has always really
      # used (the line above is not read for it). Changing it would invalidate
      # the API keys in backend/.env, so locally the check is waived. Never set
      # this in docker-compose.prod.yml or docker-compose.deploy.yml.
      OPENPROJECT_DISABLE__SECRET_KEY_BASE__CHECK: 'true'
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST__NAME:-localhost:8080}
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-false}
      OPENPROJECT_DEFAULT__LANGUAGE: en
      # Keeps EPM's library documents, which are attachments with no container,
      # from the nightly cleanup of abandoned uploads. See the Dockerfile.
      OPENPROJECT_ATTACHMENTS__GRACE__PERIOD: '52560000'
      # Concurrency.
      #
      # The image defaults to two Puma workers, which is the single hardest
      # limit on how fast EPM can feel: one page load fans out to roughly thirty
      # upstream calls, and with two workers they queue behind each other. On a
      # cold cache that queueing — not the work itself — was most of a 27-second
      # page load, and it pushed the project Tasks tab past the browser's
      # timeout entirely.
      #
      # Four workers on a machine with four or more cores costs about 400 MB
      # each and removes most of the queueing. Lower it on a small host; there is
      # no point setting it above the core count.
      OPENPROJECT_WEB_WORKERS: ${OPENPROJECT_WEB_WORKERS:-4}
      OPENPROJECT_WEB_MAX__THREADS: ${OPENPROJECT_WEB_MAX__THREADS:-8}
    volumes:
      - ${OPENPROJECT_DATA_DIR:-C:/Open-source/Open-Project}/assets:/var/openproject/assets
      # The EPM patches. Read-only: nothing in the container should rewrite them.
      - ./zzz_epm_password_grant.rb:/app/config/initializers/zzz_epm_password_grant.rb:ro
      # The EPM admin API (/epm_admin/*): users settings, permissions, roles.
      - ./zzz_epm_admin_api.rb:/app/config/initializers/zzz_epm_admin_api.rb:ro
      # The EPM admin settings API (/epm_admin/sections/*): the settings
      # sections that exist upstream only as HTML forms.
      - ./zzz_epm_admin_settings.rb:/app/config/initializers/zzz_epm_admin_settings.rb:ro
      # The EPM admin catalogue API (/epm_admin/catalog/*): create, edit and
      # delete for types, statuses, priorities, custom fields, webhooks and
      # OAuth applications, none of which API v3 lets anyone write.
      - ./zzz_epm_admin_catalog.rb:/app/config/initializers/zzz_epm_admin_catalog.rb:ro
      # The EPM analytics export (/epm_admin/analytics/*): work package
      # history as rows, read-only, for the analytics model.
      - ./zzz_epm_analytics_api.rb:/app/config/initializers/zzz_epm_analytics_api.rb:ro
      # The EPM schedule bridge (/epm_admin/schedule/*): the scheduling network
      # out for EPM's critical path pass, and the float it computes back into
      # the three schedule fields, kept out of the journal.
      - ./zzz_epm_schedule.rb:/app/config/initializers/zzz_epm_schedule.rb:ro
      # The EPM calculated-field bridge (/epm_admin/calculated/*): what the
      # formulas read, out, and the values EPM computes back into the custom
      # fields it made for them, kept out of the journal.
      - ./zzz_epm_calculated.rb:/app/config/initializers/zzz_epm_calculated.rb:ro
      # Cost types and cost entries (/epm_admin/costs/*), which API v3 cannot
      # create: approved expense claims become cost entries (Module 10).
      - ./zzz_epm_costs.rb:/app/config/initializers/zzz_epm_costs.rb:ro
      # EPM's service account (NFR06): which add-on endpoints it may call, and
      # membership of every new project. setup/service-account.rb makes the account.
      - ./zzz_epm_service.rb:/app/config/initializers/zzz_epm_service.rb:ro

volumes:
  openproject-db:
